# Render Blueprint: render.com -> New -> Blueprint -> pick this repo
services:
  - type: web
    name: smart-bus
    runtime: docker
    plan: free
    branch: main          # only main goes live; work happens on dev
    autoDeploy: true
    healthCheckPath: /api/stops
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_SCALE
        value: demo       # or "large" (32 stops, 1500 students, 30 buses)
      - key: ANTHROPIC_API_KEY
        sync: false       # optional: paste your key in the Render dashboard for AI briefings
      - key: RAZORPAY_KEY_ID
        sync: false       # college's Razorpay key id (rzp_test_... while testing)
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false       # same secret as the webhook in the Razorpay dashboard
      - key: COLLEGE_DISPLAY_NAME
        value: College Transport
